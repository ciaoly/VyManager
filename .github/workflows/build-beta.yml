name: Docker Build and Push (Beta Branch)

# 触发器配置：当 beta 分支有新代码推送时触发
on:
  workflow_dispatch:
  push:
    branches:
      - beta
  pull_request:
    branches: [ "beta" ]

# -----------------------------------------------
# 注意事项：
# 1. 如果您的工作流依赖于上游（原仓库）的某个工作流完成，
#    可以使用 'workflow_run' 触发器，但这通常过于复杂。
# 2. 最简单的方法是直接监听 'push' 到您的 'beta' 分支。
#    当您从上游 main 合并到您的 beta 时，会产生一次 push，从而触发此工作流。
# -----------------------------------------------

env:
  # github.repository as <account>/<repo>
  IMAGE_NAME: ${{ github.repository }}-frontend
  # 获取您的用户名，用于构建 ghcr.io/<USERNAME>/vymanager
  # 注意：github.repository_owner 是最安全的获取方式
  OWNER: ${{ github.repository_owner }}
  NEXT_PUBLIC_API_URL: http://vymanager-backend:8000

jobs:
  docker-build-and-tag:
    # 确保只在 beta 分支上运行
    if: github.ref == 'refs/heads/beta'|| github.base_ref == 'beta'
    
    runs-on: ubuntu-latest

    steps:
      - name: ⬇️ Checkout Code
        uses: actions/checkout@v4
        with:
          ref: beta
        # 如果需要拉取完整历史记录，可设置 fetch-depth: 0

      - name: ⚙️ Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: 🔑 Log in to GitHub Container Registry (GHCR)
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ env.OWNER }}
          # 使用内置的 GITHUB_TOKEN，它具有推送到 GHCR 的默认权限
          password: ${{ secrets.GITHUB_TOKEN }} 
          
      - name: 🏷️ Define Image Tags
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ env.IMAGE_NAME }}
          tags: |
            type=raw,value=beta
            type=sha,format=short
            
      - name: 🔨 Build and Push Docker image
        uses: docker/build-push-action@v5
        with:
          # 假设 Dockerfile 位于仓库根目录
          context: ./frontend
          push: true
          # 使用上面定义的标签
          tags: ${{ steps.meta.outputs.tags }}
          # 如果项目有特殊的构建参数或 Dockerfile 路径，请在此处指定
          # file: ./path/to/Dockerfile
